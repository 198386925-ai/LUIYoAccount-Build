<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUIYo 账号后台</title>
<style>
body{font-family:-apple-system;background:#f5f5f7;margin:0;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px;box-sizing:border-box}
button{padding:9px 14px;border:none;border-radius:10px;font-size:14px;margin:3px 2px;background:#007aff;color:#fff}
button.red{background:#ff3b30}button.gray{background:#8e8e93}button.green{background:#34c759}
.u{border-top:1px solid #eee;padding:10px 0}
.u b{font-size:15px}.tag{font-size:12px;padding:2px 8px;border-radius:6px;color:#fff}
.svip{background:#34c759}.free{background:#8e8e93}.ban{background:#ff3b30}.flag{background:#ff9500}
small{color:#888}
</style></head><body>
<h2>LUIYo 账号后台</h2>
<div class="card">
<input id="pw" type="password" placeholder="后台密码">
<button onclick="load()">加载账号列表</button>
<div id="msg"></div>
</div>
<div class="card" id="list"><small>输密码后点加载</small></div>
<div class="card">
<h3 style="margin:4px 0 8px">生成卡密（绑定账号用）</h3>
<input id="genCount" type="number" value="10" min="1" max="100" placeholder="生成数量（1-100）">
<input id="genDays" type="number" value="30" min="1" placeholder="SVIP 天数（填 36500 = 永久）">
<input id="genRemark" type="text" placeholder="备注（客户名/用途，可空）→ 卡密格式 LUI-备注-随机码">
<button onclick="genCards()">生成卡密</button>
<button class="gray" onclick="loadCards()">刷新卡密列表</button>
<div id="genMsg"></div>
<textarea id="genOut" rows="6" style="width:100%;margin-top:8px;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:13px;box-sizing:border-box" placeholder="生成的卡密会出现在这里"></textarea>
<button class="green" onclick="copyGen()">复制生成的卡密</button>
<div id="cardList" style="margin-top:8px"><small>卡密列表（生成后自动刷新）</small></div>
</div>
<div class="card">
<h3 style="margin:4px 0 8px">邮件发送记录</h3>
<button class="gray" onclick="loadMail()">刷新邮件记录</button>
<div id="mailList" style="margin-top:8px"><small>每次发验证码 / 换设备确认信都会自动记在这（最近 300 条）</small></div>
</div>
<div class="card">
<h3 style="margin:4px 0 8px">应用更新（上传 IPA）</h3>
<div id="curVer"><small>线上版本读取中…</small></div>
<input id="ipaFile" type="file" accept=".ipa" onchange="ipaPicked()">
<input id="upVer" placeholder="版本号（留空=自动识别，如 1.0.7）">
<input id="upBuild" placeholder="构建号（留空=自动识别，纯数字）">
<input id="upNotes" placeholder="更新说明（可空）">
<button onclick="uploadIPA()">上传并发布</button>
<div id="upMsg"></div>
<small>更新源地址：<span id="feedUrl"></span>（App 检查更新读这个）</small>
</div>
<script>
const API='user-auth-v2.php';
async function post(action,data){
  data=data||{};data.password=document.getElementById('pw').value;
  const r=await fetch(API+'?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  return await r.json();
}
async function load(){
  const d=await post('admin_list');
  if(!d.ok){document.getElementById('msg').textContent=d.error||'加载失败';return;}
  document.getElementById('msg').textContent='共 '+d.total+' 个账号';
  let h='';
  d.users.forEach(u=>{
    h+='<div class="u"><b>'+u.email+'</b> '
      +(u.svip?'<span class="tag svip">SVIP</span>':'<span class="tag free">免费</span>')+' '
      +(u.is_banned==1?'<span class="tag ban">已封禁</span>':'')+' '
      +(u.ip_flagged==1?'<span class="tag flag">IP异常</span>':'')+'<br>'
      +'<small>注册 '+new Date(u.created_at*1000).toLocaleString()+' · 最后登录 '+(u.last_login_at?new Date(u.last_login_at*1000).toLocaleString():'从未')
      +' · 越狱允许:'+(u.allow_jailbreak==1?'是':'否')+'</small><br>'
      +(u.udid?'<small style="font-family:monospace;color:#666">UDID: '+u.udid+'</small><br>':'')
      +(u.is_banned==1
        ?'<button class="green" onclick="ban(\''+u.email+'\',0)">解封</button>'
        :'<button class="red" onclick="ban(\''+u.email+'\',1)">封禁</button>')
      +(u.allow_jailbreak==1
        ?'<button class="gray" onclick="jb(\''+u.email+'\',0)">禁止越狱</button>'
        :'<button onclick="jb(\''+u.email+'\',1)">允许越狱</button>')
      +(u.ip_flagged==1?'<button class="gray" onclick="unflag(\''+u.email+'\')">取消IP标红</button>':'')
      +'</div>';
  });
  document.getElementById('list').innerHTML=h||'<small>暂无账号</small>';
  loadCards();
  loadMail();
}
async function ban(email,b){
  let reason=''; if(b===1){reason=prompt('封禁理由（可空）')||'';}
  const d=await post('admin_ban',{email:email,ban:b,reason:reason}); alert(d.msg||d.error); load();
}
async function jb(email,a){const d=await post('admin_jailbreak',{email:email,allow:a}); alert(d.msg||d.error); load();}
async function unflag(email){const d=await post('admin_unflag',{email:email}); alert(d.msg||d.error); load();}
// ---- 卡密管理 ----
async function genCards(){
  const c=parseInt(document.getElementById('genCount').value)||1;
  const dys=parseInt(document.getElementById('genDays').value)||30;
  const rmk=document.getElementById('genRemark').value.trim();
  const d=await post('admin_gen_cards',{count:c,days:dys,remark:rmk});
  const msg=document.getElementById('genMsg');
  if(!d.ok){msg.textContent=d.error||'生成失败';return;}
  document.getElementById('genOut').value=d.codes.join('\n');
  msg.textContent='✅ 已生成 '+d.count+' 张（每张 '+d.days+' 天）';
  loadCards();
}
function copyGen(){
  const t=document.getElementById('genOut'); if(!t.value)return;
  t.select(); document.execCommand('copy');
  document.getElementById('genMsg').textContent='已复制 '+t.value.split('\n').length+' 张卡密';
}
function cpText(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
function cardRow(c,used){
  const st=c.disabled?'<span class="tag ban">已作废</span>':(used?'<span class="tag svip">已绑定</span>':'<span class="tag free">未使用</span>');
  let h='<div class="u"><b style="font-family:monospace;font-size:13px">'+c.code+'</b> '+st
    +' <button class="gray" data-v="'+c.code+'" onclick="cpText(this.dataset.v)">复制卡密</button><br>'
    +(c.remark?'<small><b>备注：'+c.remark+'</b></small><br>':'');
  if(used){
    h+='<small style="color:green">账号：'+c.bound_email+'</small> <button class="gray" data-v="'+c.bound_email+'" onclick="cpText(this.dataset.v)">复制</button><br>'
      +(c.bound_udid?'<small style="font-family:monospace">UDID：'+c.bound_udid+'</small> <button class="gray" data-v="'+c.bound_udid+'" onclick="cpText(this.dataset.v)">复制</button><br>':'<small>UDID：未获取</small><br>');
  }
  h+='<small>'+(c.days>=36500?'永久':c.days+' 天')+' · 生成于 '+new Date(c.created_at*1000).toLocaleString()
    +(used&&c.bound_at?' · 绑定于 '+new Date(c.bound_at*1000).toLocaleString():'')+'</small><br>'
    +(c.disabled
      ?'<button class="green" onclick="disableCard('+c.id+',0)">恢复</button>'
      :'<button class="red" onclick="disableCard('+c.id+',1)">作废</button>')
    +' <button class="red" onclick="deleteCard('+c.id+')">删除</button>'
    +'</div>';
  return h;
}
async function loadCards(){
  const d=await post('admin_list_cards');
  const el=document.getElementById('cardList');
  if(!d.ok){el.innerHTML='<small>'+(d.error||'加载失败')+'</small>';return;}
  const used=d.cards.filter(c=>c.bound_email), free=d.cards.filter(c=>!c.bound_email);
  let h='<h4 style="margin:6px 0">已使用（'+used.length+'）</h4>';
  h+=used.length?used.map(c=>cardRow(c,true)).join(''):'<small>暂无</small>';
  h+='<h4 style="margin:10px 0 6px">未使用（'+free.length+'）</h4>';
  h+=free.length?free.map(c=>cardRow(c,false)).join(''):'<small>暂无</small>';
  el.innerHTML=h;
}
async function loadMail(){
  const d=await post('admin_mail_log');
  const el=document.getElementById('mailList');
  if(!d.ok){el.innerHTML='<small>'+(d.error||'加载失败')+'</small>';return;}
  if(!d.logs.length){el.innerHTML='<small>暂无发信记录</small>';return;}
  let h='';
  d.logs.forEach(m=>{
    h+='<div class="u"><b>'+m.to_email+'</b> '
      +(m.ok==1?'<span class="tag svip">发送成功</span>':'<span class="tag ban">发送失败</span>')+'<br>'
      +'<small>'+m.subject+' · '+new Date(m.created_at*1000).toLocaleString()+'</small></div>';
  });
  el.innerHTML=h;
}
async function disableCard(id,dis){const d=await post('admin_disable_card',{id:id,disabled:dis}); alert(d.msg||d.error); loadCards();}
async function deleteCard(id){if(!confirm('确定删除这张卡密？删了就没了'))return;const d=await post('admin_delete_card',{id:id}); alert(d.msg||d.error); loadCards();}
// ---- 应用更新 ----
const UPD='app-update.php';
document.getElementById('feedUrl').textContent=location.origin+'/updates/latest.json';
async function loadCurrent(){
  try{
    const r=await fetch('updates/latest.json?t='+Date.now());
    if(!r.ok)throw 0;
    const j=await r.json();
    const a=(j.assets&&j.assets[0])||{};
    document.getElementById('curVer').innerHTML='<small>当前线上：<b>'+j.tag_name+'</b> · '+a.name+' · '+Math.round((a.size||0)/1024)+' KB</small>';
  }catch(e){document.getElementById('curVer').innerHTML='<small>当前线上：尚未发布任何版本</small>';}
}
function ipaPicked(){
  const f=document.getElementById('ipaFile').files[0]; if(!f)return;
  let m=f.name.match(/^LUIYo-([0-9]+(?:\.[0-9]+){1,3})-b([1-9][0-9]*)\.ipa$/i);
  if(!m)m=f.name.match(/-([0-9]+(?:\.[0-9]+){1,3}(?:-[0-9]+)?)-Build\(([0-9]+)\)\.ipa$/i);
  if(m){document.getElementById('upVer').value=m[1].replace(/-[0-9]+$/,'');document.getElementById('upBuild').value=m[2];}
}
async function uploadIPA(){
  const f=document.getElementById('ipaFile').files[0];
  const msg=document.getElementById('upMsg');
  if(!f){msg.textContent='先选择 IPA 文件';return;}
  const fd=new FormData();
  fd.append('password',document.getElementById('pw').value);
  fd.append('ipa',f);
  fd.append('version',document.getElementById('upVer').value);
  fd.append('build',document.getElementById('upBuild').value);
  fd.append('notes',document.getElementById('upNotes').value);
  msg.textContent='上传中…（大文件多等一会）';
  try{
    const r=await fetch(UPD+'?action=upload_ipa',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){msg.innerHTML='✅ 已发布：'+d.name+'<br><small>sha256: '+d.sha256+'</small>';loadCurrent();}
    else{msg.textContent='❌ '+(d.error||'上传失败');}
  }catch(e){msg.textContent='❌ 网络错误：'+e;}
}
loadCurrent();
</script>
</body></html>
